[project]
name = "filter-possum"
version = "0.1.0"
description = "What single dishes vs interferometers recover of a diffuse Faraday screen (POSSUM-like band)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "dask>=2024.1",
    "rm-lite>=2026.11.0",
]

[project.scripts]
filter-possum-sim = "filter_possum.uvfilter_sim:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filter_possum"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
